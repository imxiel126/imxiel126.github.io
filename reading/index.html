<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="个人微信读书阅读中心"><title>阅读中心 · 我的知识坐标</title>
<style>
:root{--ink:#172d3d;--mute:#597283;--line:#dae6e8;--green:#107f69}*{box-sizing:border-box}body{margin:0;background:#f5f9f8;color:var(--ink);font:16px/1.7 system-ui,"PingFang SC",sans-serif}a{color:var(--green)}header{max-width:1100px;margin:auto;padding:22px 24px;display:flex;justify-content:space-between}main{max-width:1100px;margin:auto;padding:0 24px 50px}.hero{background:linear-gradient(110deg,#e2f2ec,#fff8e6);padding:58px 6%;border-radius:22px}.eyebrow{font-size:12px;letter-spacing:.16em;color:var(--green);font-weight:700}h1{font:700 clamp(32px,5vw,52px)/1.2 Georgia,"Songti SC",serif}h2{font:700 26px Georgia,"Songti SC",serif;margin:0 0 14px}p,.muted{color:var(--mute)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.stat,.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:18px}.stat b{display:block;font-size:29px;color:var(--green)}.stat small{color:var(--mute)}.head{display:flex;gap:20px;justify-content:space-between;align-items:center;margin-bottom:15px}.actions{display:flex;gap:8px;flex-wrap:wrap}button,input,select{font:inherit;background:white;border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--ink)}button.active{background:var(--ink);color:white}.books,.notes,.summaries{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}.book{display:flex;gap:14px;border:1px solid var(--line);border-radius:13px;padding:14px;min-height:132px}.book img,.cover{width:74px;height:108px;flex-shrink:0;object-fit:cover;border-radius:6px;background:#edf1ef}.cover{display:grid;place-items:center}.book h3{font-size:16px;line-height:1.4;margin:0 0 5px}.book p{font-size:13px;margin:2px 0}.progress{background:#e2ede9;height:5px;border-radius:10px;overflow:hidden;margin-top:8px}.progress i{height:100%;display:block;background:#17a48c}.notes article,.summaries article{border:1px solid #eee7d6;background:#fffcf4;border-radius:12px;padding:16px}.trend{display:flex;gap:5px;height:135px;align-items:flex-end;border-bottom:1px solid var(--line);overflow:auto}.trend span{min-width:16px;background:#70bdaa;border-radius:4px 4px 0 0}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:22px}.tags span{padding:4px 10px;border-radius:40px;background:#e8f5f0;font-size:13px;color:#286c5a}footer{text-align:center;padding:0 10px 35px;color:var(--mute);font-size:13px}[hidden]{display:none!important}@media(max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}.head{align-items:flex-start;flex-direction:column}.hero{padding:36px 22px}main{padding:0 14px 30px}}
.intro-snip{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;line-height:1.6;color:var(--mute)}
.keyword-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.keyword-tags span{font-size:11px;color:#357661;background:#e9f5ef;border-radius:20px;padding:2px 7px}
.detail-btn{margin-top:10px;cursor:pointer;color:#fff;background:var(--green);border-color:var(--green);font-size:13px}
.detail-btn:focus-visible,button:focus-visible{outline:3px solid #efb64a;outline-offset:2px}
#book-detail{width:min(720px,94vw);max-height:88vh;overflow:auto;border:1px solid var(--line);border-radius:20px;padding:26px;background:#fff;color:var(--ink);box-shadow:0 16px 60px #173c3f44}
#book-detail::backdrop{background:#122c37a8}.detail-heading{display:flex;gap:16px;align-items:start}.detail-heading img{width:82px;object-fit:cover;border-radius:8px}
#book-detail section{border-top:1px solid var(--line);padding-top:14px;margin:18px 0}#book-detail h3{margin:0 0 8px;font-size:19px}
#book-detail blockquote,.quote-card blockquote{margin:10px 0;padding:10px 14px;border-left:3px solid #43a28a;background:#f3faf7}
#book-detail .smallnote{font-size:12px;color:var(--mute)}.quote-card{border:1px solid var(--line);border-radius:14px;padding:16px;background:#fcfefc}
.term-pill{cursor:pointer}.term-pill:hover{text-decoration:underline}.knowledge-meta{font-size:13px;color:var(--mute)}
</style></head>
<body><header><a href="/"><b>← 联播晨读</b></a><a href="https://github.com/imxiel126">GitHub</a></header><main>
<section class="hero"><div class="eyebrow">READING JOURNAL · 阅读与思考</div><h1>在阅读中，建立自己的知识坐标</h1><p>我的书架、阅读习惯、精选笔记与 AI 导读。</p><small id="status">正在加载公开阅读数据…</small></section>
<section class="panel" id="empty" hidden><h2>阅读中心已就绪</h2><p>等待你设置微信读书授权密钥和公开同步开关。尚未发布任何个人书架或笔记数据。</p></section>
<div id="dashboard" hidden><section class="stats" id="stats"></section>
<section class="panel"><div class="head"><h2>阅读时光</h2><div class="actions" id="periods"><button data-mode="weekly">本周</button><button data-mode="monthly" class="active">本月</button><button data-mode="annually">今年</button><button data-mode="overall">累计</button></div></div><div class="trend" id="trend"></div><div class="tags" id="categories"></div></section>
<section class="panel"><div class="head"><h2>我的书架</h2><div class="actions"><input id="search" type="search" placeholder="搜索书名、作者、关键词、术语" aria-label="搜索书架"><select id="filter" aria-label="筛选书籍"><option value="all">全部</option><option value="reading">在读</option><option value="finished">已读完</option><option value="audio">有声书</option><option value="notes">有笔记</option></select></div></div><p id="book-count"></p><div class="books" id="books"></div></section>
<section class="panel"><h2>公开的读书笔记</h2><p>仅公开明确加入白名单的书籍笔记。其他笔记只展示数量。</p><div class="notes" id="notes"></div></section>
<section class="panel"><div class="head"><h2>书中精选短句</h2><small>微信读书公开热门划线，每本仅展示一条简短摘句</small></div><div class="notes" id="quotes"></div></section>
<section class="panel"><div class="head"><h2>专业词汇与主题词索引</h2><small>点击词汇可搜索相关书籍</small></div><div class="tags" id="term-index"></div></section>
<section class="panel"><h2>AI 导读</h2><p>依据公开简介和主动公开的个人心得生成，并非全书内容总结。</p><div class="summaries" id="summaries"></div></section></div>
<dialog id="book-detail" aria-label="书籍知识卡"><div style="display:flex;justify-content:flex-end"><button id="close-detail" type="button">关闭 ×</button></div><div id="book-detail-body"></div></dialog>
</main><footer>尊重隐私与版权 · <a href="/">返回主页</a></footer>
<script>
'use strict';
const $=id=>document.getElementById(id),el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=String(text);if(cls)n.className=cls;return n;},duration=s=>{s=Number(s)||0;return s>=3600?Math.floor(s/3600)+'小时'+Math.floor(s%3600/60)+'分':Math.floor(s/60)+'分钟'},link=s=>{try{let u=new URL(s);return u.protocol==='https:'?u.href:''}catch{return''}};
let data,mode='monthly',query='',filter='all';
function renderStats(){const v=data.stats[mode]||{};$('stats').replaceChildren(...[['阅读总时长',duration(v.seconds)],['有效阅读天数',(v.days||0)+'天'],['自然日平均',duration(v.averageSeconds)],['公开书架',data.books.length+'项']].map(([a,b])=>{const n=el('div',undefined,'stat');n.append(el('b',b),el('small',a));return n}));
const vals=Object.entries(v.readTimes||{}).sort((a,b)=>Number(a[0])-Number(b[0])),peak=Math.max(1,...vals.map(x=>Number(x[1])));$('trend').replaceChildren(...vals.map(([ts,s])=>{const e=el('span');e.style.height=Math.max(2,Math.round(100*Number(s)/peak))+'%';e.title=new Date(Number(ts)*1000).toLocaleDateString('zh-CN')+' · '+duration(s);return e}));if(!vals.length)$('trend').append(el('p','暂无趋势数据'));
$('categories').replaceChildren(...(v.categories||[]).filter(x=>x.name).map(x=>el('span',x.name)))}
function renderBooks(){const selected=data.books.filter(b=>[b.title,b.author,b.category,b.guide?.intro,...(b.guide?.keywords||[]),...(b.guide?.terms||[]).map(t=>t.name)].join(' ').toLowerCase().includes(query)&& (filter==='all'||(filter==='finished'&&b.finished)||(filter==='reading'&&b.type==='ebook'&&!b.finished)||(filter==='audio'&&b.type==='audio')||(filter==='notes'&&Object.values(b.notes||{}).some(Number))));$('book-count').textContent='当前展示 '+selected.length+' 项';
$('books').replaceChildren(...selected.map(b=>{const card=el('article',undefined,'book'),url=link(b.cover);if(url){let img=el('img');img.src=url;img.alt=b.title+'封面';img.loading='lazy';img.referrerPolicy='no-referrer';card.append(img)}else card.append(el('div','📖','cover'));const info=el('div');let title=el('h3');if(link(b.link)){const a=el('a',b.title);a.href=link(b.link);title.append(a)}else title.textContent=b.title;info.append(title,el('p',b.author||'作者未知'),el('p',(b.type==='audio'?'有声书':'电子书')+' · '+(b.category||'未分类')+(b.finished?' · 已读完':'')));if(b.progress!==null&&b.progress!==undefined){info.append(el('p','阅读进度 '+b.progress+'%'));const progress=el('div',undefined,'progress'),i=el('i');i.style.width=Math.max(0,Math.min(100,b.progress))+'%';progress.append(i);info.append(progress)}const notes=b.notes||{},n=(notes.highlights||0)+(notes.thoughts||0)+(notes.bookmarks||0);if(n)info.append(el('p','笔记 '+n+' 条（含书签）'));
const g=b.guide||{};
if(g.intro)info.append(el('p',g.intro,'intro-snip'));
if((g.keywords||[]).length){const t=el('div',undefined,'keyword-tags');t.append(...g.keywords.slice(0,3).map(word=>el('span',word)));info.append(t)}
const more=el('button',g.checkedOn?'查看知识卡 · 导读 / 短句 / 评价':'查看详情 · 内容待补充','detail-btn');more.type='button';more.onclick=()=>showBookDetail(b);info.append(more);
card.append(info);return card}));if(!selected.length)$('books').append(el('p','暂无匹配的书籍'))}
function renderNotes(){const items=data.books.flatMap(b=>(b.excerpts||[]).map(x=>{const n=el('article');n.append(el('b',b.title),el('p',x.type==='highlight'?'精选划线':'我的想法'),el('blockquote',x.text));return n}));$('notes').replaceChildren(...(items.length?items:[el('p','目前没有公开的笔记正文。')]))}
function sectionFor(parent,title){const s=el('section'),h=el('h3',title);s.append(h);parent.append(s);return s}
function showBookDetail(book){
  const body=$('book-detail-body'),g=book.guide||{};body.replaceChildren();
  const head=el('div',undefined,'detail-heading'),details=el('div');
  const imgUrl=link(book.cover);if(imgUrl){const img=el('img');img.src=imgUrl;img.alt=book.title+'封面';img.loading='lazy';head.append(img)}
  details.append(el('h2',book.title),el('p',book.author||'作者未知'),el('p',book.category||'未分类','knowledge-meta'));
  if(g.publisher)details.append(el('p','出版社：'+g.publisher,'knowledge-meta'));
  if(g.rating!==null&&g.rating!==undefined)details.append(el('p','微信读书评分：'+g.rating+'/100'+(g.ratingCount?' · '+g.ratingCount+'人评分':''),'knowledge-meta'));
  if(link(book.link)){const a=el('a','在微信读书查看原书');a.href=link(book.link);a.target='_blank';a.rel='noopener noreferrer';details.append(a)}
  head.append(details);body.append(head);
  sectionFor(body,'这本书讲什么').append(el('p',g.intro||'书籍简介正在按批次补充，请查看微信读书原书介绍。'));
  const words=sectionFor(body,'关键词与专业术语'),tags=el('div',undefined,'tags');
  tags.append(...(g.keywords||[]).map(w=>el('span',w)));
  words.append(tags);
  if((g.terms||[]).length){for(const t of g.terms){const p=el('p');p.append(el('strong',t.name+'：'),document.createTextNode(t.definition));words.append(p)}}
  else words.append(el('p','暂未发现与内置知识词库匹配的专业术语。','smallnote'));
  const quotes=sectionFor(body,'书中精选短句');
  if(g.quote?.text){quotes.append(el('blockquote',g.quote.text),el('p','来源：微信读书热门划线'+(g.quote.highlights?' · '+g.quote.highlights+'人标注':''),'smallnote'))}
  else quotes.append(el('p','该书尚无适合展示的简短公开划线。'));
  const reviews=sectionFor(body,'其他读者的公开评价');
  if(g.review?.text)reviews.append(el('blockquote',g.review.text),el('p','公开读者点评'+(g.review.author?' · '+g.review.author:'')+(g.review.stars?' · '+g.review.stars+'/5星':''),'smallnote'));
  else reviews.append(el('p','目前没有适合摘录的简短公开评价。'));
  if(g.deepRecommendationPct!==undefined)reviews.append(el('p','资深会员推荐比例：'+g.deepRecommendationPct+'%','knowledge-meta'));
  if(book.summary)sectionFor(body,'AI 导读').append(el('p',book.summary));
  body.append(el('p','资料来自微信读书公开信息；摘录不代表完整章节或全部读者意见。','smallnote'));
  const dialog=$('book-detail');if(typeof dialog.showModal==='function')dialog.showModal();else dialog.setAttribute('open','');
}
function renderKnowledge(){
  const quotes=data.books.filter(b=>b.guide?.quote?.text).slice(0,9);
  $('quotes').replaceChildren(...(quotes.length?quotes.map(b=>{const card=el('article',undefined,'quote-card');card.append(el('b',b.title),el('blockquote',b.guide.quote.text));const btn=el('button','查看这本书','detail-btn');btn.onclick=()=>showBookDetail(b);card.append(btn);return card}):[el('p','精华短句正在分批同步，稍后将显示公开热门划线。')]));
  const keys=[...new Set(data.books.flatMap(b=>(b.guide?.terms||[]).map(t=>t.name)))].slice(0,36);
  $('term-index').replaceChildren(...(keys.length?keys.map(word=>{const btn=el('button',word,'term-pill');btn.type='button';btn.onclick=()=>{$('search').value=word;query=word.toLowerCase();renderBooks();$('books').scrollIntoView({behavior:'smooth',block:'start'})};return btn}):[el('p','专业术语索引正在逐批生成。')]));
}
$('close-detail').onclick=()=>$('book-detail').close();
function renderSummaries(){const items=data.books.filter(b=>b.summary).map(b=>{const n=el('article');n.append(el('b',b.title),el('p',b.summary));return n});$('summaries').replaceChildren(...(items.length?items:[el('p','暂无 AI 导读；可选配置 OPENAI_API_KEY 启用。')]))}
fetch('/reading/data.json?ts='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(d=>{if(!d.ready){$('empty').hidden=false;$('status').textContent='公开同步尚未启用';return}data=d;$('dashboard').hidden=false;$('status').textContent='最近同步：'+new Date(d.updated).toLocaleString('zh-CN');renderStats();renderBooks();renderNotes();renderSummaries();renderKnowledge();$('periods').querySelectorAll('button').forEach(btn=>btn.onclick=()=>{mode=btn.dataset.mode;$('periods').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===btn));renderStats()});$('search').oninput=e=>{query=e.target.value.trim().toLowerCase();renderBooks()};$('filter').onchange=e=>{filter=e.target.value;renderBooks()}}).catch(e=>{$('empty').hidden=false;$('status').textContent='数据暂时无法加载';console.error(e)});
</script></body></html>
