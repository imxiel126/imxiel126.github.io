name: 同步公开研究主页
on:
  schedule:
    # 每六小时检查一次公开研究站（UTC）；变化后自动更新本地 JSON
    - cron: '12 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/**'
      - 'scripts/sync_research.py'
      - '.github/workflows/research-sync.yml'
permissions:
  contents: write
concurrency:
  group: research-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/configure-pages@v5
      - name: 验证研究同步程序语法
        run: python3 -m py_compile scripts/sync_research.py
      - name: 从公开研究仓库同步可展示资料
        run: python3 scripts/sync_research.py
      - name: 只在资料变化时提交
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/data.json
          if ! git diff --cached --quiet; then
            git commit -m '自动同步公开研究资料'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
