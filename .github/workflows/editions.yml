name: 主页与氢能行业晨报
on:
  schedule:
    - cron: '10 23 * * *'
    - cron: '20 23 * * *'
  workflow_dispatch:
    inputs:
      edition:
        type: choice
        options: [home, hydrogen]
permissions:
  contents: read
jobs:
  mail:
    runs-on: ubuntu-latest
    env:
      EDITION: ${{ inputs.edition || (github.event.schedule == '20 23 * * *' && 'home' || 'hydrogen') }}
    steps:
      - uses: actions/checkout@v4
      - if: env.EDITION == 'home'
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - run: |
          echo "ISSUE_DATE=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_ENV"
      - run: python scripts/editions.py "$EDITION"
      - env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          if [ "$EDITION" = home ]; then title=个人主页晨报; else title=氢能行业晨报; fi
          MAIL_SUBJECT="$title｜$ISSUE_DATE" python scripts/daily.py send
