name: 主页与氢能行业晨报
on:
  schedule:
    # 每20分钟补偿一次，覆盖北京时间07:00—08:50。
    # 07:00/07:20/... 为主页；07:10/07:30/... 为氢能。
    - cron: '10,30,50 23,0 * * *'
    - cron: '0,20,40 23,0 * * *'
  workflow_dispatch:
    inputs:
      edition:
        type: choice
        options: [home, hydrogen]
        required: true
      retry_pending:
        description: "仅在确认 Gmail 未收到且上次发送结果不确定时重试"
        type: boolean
        required: false
        default: false
permissions:
  contents: write
concurrency:
  group: morning-edition-${{ inputs.edition || (github.event.schedule == '0,20,40 23,0 * * *' && 'home' || 'hydrogen') }}
  cancel-in-progress: false
jobs:
  mail:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EDITION: ${{ inputs.edition || (github.event.schedule == '0,20,40 23,0 * * *' && 'home' || 'hydrogen') }}
      RETRY_PENDING: ${{ inputs.retry_pending || false }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 确定北京时间报告日期
        run: echo "ISSUE_DATE=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_ENV"
      - name: 检查本日报投递状态
        id: check
        run: |
          git fetch origin main
          marker_path=".sent/edition-$EDITION-$ISSUE_DATE.txt"
          expected_report_id="$EDITION-$(TZ=Asia/Shanghai date +%Y%m%d)"
          if git cat-file -e "origin/main:$marker_path" 2>/dev/null; then
            marker="$(git show "origin/main:$marker_path")"
            if [[ "$marker" == *"status=smtp_accepted"* && "$marker" == *"report_id=$expected_report_id"* ]]; then
              echo "sent=true" >> "$GITHUB_OUTPUT"
              echo "本日报已有 SMTP 接受记录，跳过重复发送"
            elif [[ "$marker" == *"status=pending"* && "$RETRY_PENDING" != "true" ]]; then
              echo "sent=true" >> "$GITHUB_OUTPUT"
              echo "::warning::上次发送结果不确定，先核验 Gmail 报告编号，禁止自动重发"
            elif [[ "$marker" != *"status=pending"* && "$marker" != *"status=retryable"* ]]; then
              echo "sent=true" >> "$GITHUB_OUTPUT"
              echo "::warning::发现旧版或不完整投递记录，为避免重复发送，本次不自动重发"
            fi
          fi
      - name: 安装主页日报浏览器
        if: steps.check.outputs.sent != 'true' && env.EDITION == 'home'
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: 生成日报内容并检查来源
        if: steps.check.outputs.sent != 'true'
        run: |
          python3 -m py_compile scripts/daily.py scripts/editions.py scripts/report_mail_utils.py
          python3 scripts/editions.py "$EDITION"
      - name: 检查 SMTP 配置
        if: steps.check.outputs.sent != 'true'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          if [ -z "$SMTP_HOST" ] || [ -z "$SMTP_USER" ] || [ -z "$SMTP_PASSWORD" ] || [ -z "$MAIL_TO" ]; then
            echo "::error::SMTP secrets are missing; no delivery claim was created"
            exit 1
          fi
      - name: 先提交投递声明，防止不确定结果导致重复发送
        if: steps.check.outputs.sent != 'true'
        id: claim
        run: |
          set -euo pipefail
          marker_path=".sent/edition-$EDITION-$ISSUE_DATE.txt"
          report_id="$EDITION-$(TZ=Asia/Shanghai date -d "$ISSUE_DATE" +%Y%m%d)"
          claim_id="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            if git cat-file -e "origin/main:$marker_path" 2>/dev/null; then
              existing="$(git show "origin/main:$marker_path")"
              if [[ "$existing" == *"status=smtp_accepted"* && "$existing" == *"report_id=$report_id"* ]]; then
                echo "claimed=false" >> "$GITHUB_OUTPUT"
                exit 0
              elif [[ "$existing" == *"claim_id=$claim_id"* && "$existing" == *"status=pending"* ]]; then
                echo "claimed=true" >> "$GITHUB_OUTPUT"
                exit 0
              elif [[ "$existing" == *"status=pending"* && "$RETRY_PENDING" == "true" ]] || [[ "$existing" == *"status=retryable"* ]]; then
                :
              else
                echo "::error::An unresolved delivery marker exists; refusing to send"
                exit 1
              fi
            fi
            mkdir -p .sent
            printf 'report_id=%s\nstatus=pending\nclaim_id=%s\nclaimed_at=%s\n' "$report_id" "$claim_id" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$marker_path"
            git add "$marker_path"
            git -c user.name='Daily Editions' -c user.email='github-actions[bot]@users.noreply.github.com' commit -m "声明 $EDITION 晨报投递 $ISSUE_DATE"
            if git push origin HEAD:main; then
              echo "claimed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 4
          done
          echo "::error::Could not persist the delivery claim"
          exit 1
      - name: 投递邮件并确认 SMTP 接受状态
        if: steps.check.outputs.sent != 'true' && steps.claim.outputs.claimed == 'true'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          REPORT_KIND: ${{ env.EDITION }}
        run: |
          set -euo pipefail
          send_output="$(python3 scripts/daily.py send)"
          printf '%s\n' "$send_output"
          report_id="$(printf '%s\n' "$send_output" | sed -n 's/^Report-ID: //p' | tail -n 1)"
          expected_report_id="$EDITION-$(TZ=Asia/Shanghai date -d "$ISSUE_DATE" +%Y%m%d)"
          if [ "$report_id" != "$expected_report_id" ] || ! printf '%s\n' "$send_output" | grep -q '^SMTP_STAGE=accepted$'; then
            echo "::error::SMTP did not confirm acceptance; the pending marker remains to prevent accidental duplicates"
            exit 1
          fi
          marker_path=".sent/edition-$EDITION-$ISSUE_DATE.txt"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            existing="$(git show "origin/main:$marker_path" 2>/dev/null || true)"
            if [[ "$existing" == *"status=smtp_accepted"* && "$existing" == *"report_id=$report_id"* ]]; then
              echo "SMTP acceptance already recorded"
              exit 0
            fi
            if [[ "$existing" != *"status=pending"* || "$existing" != *"report_id=$report_id"* ]]; then
              echo "::error::Pending claim changed unexpectedly; Gmail verification is required"
              exit 1
            fi
            printf 'report_id=%s\nstatus=smtp_accepted\nsmtp_accepted_at=%s\nsmtp_accepted_recipients=1\nfinal_delivery=unverified\n' "$report_id" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$marker_path"
            git add "$marker_path"
            git -c user.name='Daily Editions' -c user.email='github-actions[bot]@users.noreply.github.com' commit -m "确认 $EDITION 晨报 SMTP 接受 $ISSUE_DATE"
            if git push origin HEAD:main; then
              echo "SMTP acceptance marker committed"
              exit 0
            fi
            sleep 4
          done
          echo "::error::SMTP accepted the report but the final marker could not be saved; pending claim prevents auto-resend"
          exit 1
