name: 发布社交内容中心
on:
  push:
    branches: [main]
    paths:
      - 'social/**'
      - 'index.html'
      - 'assets/**'
      - 'learn/**'
      - 'library/**'
      - 'scripts/first-issue.html'
      - 'scripts/check_homepage_feed.py'
      - 'scripts/daily.py'
      - '.github/workflows/social-pages.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 */3 * * *' # 约每三小时补偿一次发布，防止暂时性部署失败
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 使用 main 分支最新文件，避免多个工作流发布旧版本
        run: git fetch origin main && git reset --hard origin/main
      - uses: actions/configure-pages@v5
      - name: 校验社交内容格式
        run: |
          python3 -m json.tool social/data.json > /dev/null
          python3 -m json.tool social/recommendations.json > /dev/null
          node --check social/recommendations.js
          node --check social/personal-feed.js
          node --check assets/morning.js
          python3 scripts/check_homepage_feed.py
          python3 -m py_compile scripts/daily.py scripts/social_discover.py
          python3 - <<'PY'
          import json
          d=json.load(open('social/data.json'))
          assert isinstance(d.get('items'),list)
          assert isinstance(d.get('profiles'),dict)
          print('Social feed schema is valid')
          PY
      - name: 构建全站产物
        run: |
          mkdir -p site
          cp index.html site/
          for folder in archive notes reading library social research learn assets; do
            if [ -d "$folder" ]; then cp -R "$folder" site/; fi
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          name: site-${{ github.run_id }}-${{ github.run_attempt }}
          path: site
      - name: 等待 Pages 部署产物可被读取
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_ARTIFACT_NAME: site-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          url = ('https://api.github.com/repos/' + os.environ['GH_REPOSITORY']
                 + '/actions/runs/' + os.environ['GH_RUN_ID'] + '/artifacts?per_page=100')
          req = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'User-Agent': 'pages-artifact-check',
          })
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      data = json.load(resp)
                  matches = [a for a in data.get('artifacts', [])
                             if a.get('name') == os.environ['GH_ARTIFACT_NAME'] and not a.get('expired')]
                  if len(matches) == 1:
                      print('Found exactly one Pages artifact:', matches[0]['id'])
                      break
                  print('Pages artifact not ready (count=%s), retry %d' %
                        (len(matches), attempt + 1))
              except Exception as error:
                  print('Artifact index not ready:', str(error))
              time.sleep(5)
          else:
              raise SystemExit('Pages artifact not available after 60 seconds')
          PY
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: site-${{ github.run_id }}-${{ github.run_attempt }}
