name: 微信读书阅读中心自动同步
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/weread.yml'
      - 'scripts/weread_sync.py'
      - 'scripts/weread_enrich.py'
      - 'scripts/test_weread_enrich.py'
      - 'reading/index.html'
      - 'reading/reflections.css'
      - 'reading/reflections.js'
  schedule:
    - cron: '15 1 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages-deploy
  cancel-in-progress: false
jobs:
  sync:
    if: ${{ github.ref == 'refs/heads/main' && vars.WEREAD_PUBLIC_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检查程序与网页语法
        run: |
          python3 -m py_compile scripts/weread_sync.py scripts/weread_enrich.py
          python3 -m unittest discover -s scripts -p "test_weread_enrich.py" -v
          python3 -c "from pathlib import Path; s=Path('reading/index.html').read_text(); Path('/tmp/reading.js').write_text(s.split('<script>',1)[1].split('</script>',1)[0])"
          node --check /tmp/reading.js
          node --check reading/reflections.js
      - name: 同步已授权公开的微信读书数据
        env:
          WEREAD_PUBLIC_ENABLED: ${{ vars.WEREAD_PUBLIC_ENABLED }}
          WEREAD_API_KEY: ${{ secrets.WEREAD_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
        run: python3 scripts/weread_sync.py
      - name: 为书籍补充短介绍、词汇、摘句与公开评价
        env:
          WEREAD_PUBLIC_ENABLED: ${{ vars.WEREAD_PUBLIC_ENABLED }}
          WEREAD_API_KEY: ${{ secrets.WEREAD_API_KEY }}
          WEREAD_INTRO_BATCH: ${{ vars.WEREAD_INTRO_BATCH || '239' }}
          WEREAD_DISCUSSION_BATCH: ${{ vars.WEREAD_DISCUSSION_BATCH || '24' }}
        run: python3 scripts/weread_enrich.py
      - name: 保存公开数据
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/data.json
          if ! git diff --cached --quiet; then
            git commit -m '更新微信读书公开数据与知识卡'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: 打包整个网站
        run: |
          mkdir -p site
          cp index.html site/
          cp -R archive reading site/
          if [ -d notes ]; then cp -R notes site/; fi
          if [ -d library ]; then cp -R library site/; fi
          if [ -d social ]; then cp -R social site/; fi
          if [ -d assets ]; then cp -R assets site/; fi
          if [ -d research ]; then cp -R research site/; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
