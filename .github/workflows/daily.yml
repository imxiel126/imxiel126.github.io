name: 新闻联播晨读
on:
  schedule:
    - cron: '37 23 * * *' # 北京时间次日07:37
    - cron: '47 0 * * *' # 北京时间次日08:47补偿同步
  workflow_dispatch:
concurrency:
  group: pages-deploy
  cancel-in-progress: false
jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 确定播出日期
        run: echo "ISSUE_DATE=$(TZ=Asia/Shanghai date -d yesterday +%F)" >> "$GITHUB_ENV"
      - name: 检查投递记录
        id: check
        run: test ! -f ".sent/details-$ISSUE_DATE" || echo "sent=true" >> "$GITHUB_OUTPUT"
      - name: 整理晨报
        run: python3 scripts/daily.py generate
      - name: 发布网页和归档
        run: |
          git config user.name 'News Digest'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html archive
          git diff --cached --quiet || git commit -m "晨读 $ISSUE_DATE"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: 邮件投递
        if: steps.check.outputs.sent != 'true'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          if [ -z "$SMTP_HOST" ] || [ -z "$SMTP_USER" ] || [ -z "$SMTP_PASSWORD" ] || [ -z "$MAIL_TO" ]; then
            echo "邮件未配置；晨读网页仍会每天自动更新"
            exit 0
          fi
          python3 scripts/daily.py send
          mkdir -p .sent
          touch ".sent/details-$ISSUE_DATE"
          git add ".sent/details-$ISSUE_DATE"
          git commit -m "记录投递 $ISSUE_DATE"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: 打包公开网页
        if: always() && hashFiles('archive/*.html') != ''
        run: mkdir -p site && cp -R index.html archive notes reading library social research assets site/
      - uses: actions/upload-pages-artifact@v3
        if: always() && hashFiles('archive/*.html') != ''
        with:
          name: site-${{ github.run_id }}-${{ github.run_attempt }}
          path: site
  deploy:
    needs: digest
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
        with:
          artifact_name: site-${{ github.run_id }}-${{ github.run_attempt }}
