name: 新闻联播晨读
on:
  schedule:
    - cron: '37 23 * * *' # 北京时间次日07:37
    - cron: '47 0 * * *' # 北京时间次日08:47补偿同步
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily.yml'
      - 'scripts/daily.py'
concurrency:
  group: news-digest
  cancel-in-progress: false
jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 确定播出日期
        run: echo "ISSUE_DATE=$(TZ=Asia/Shanghai date -d yesterday +%F)" >> "$GITHUB_ENV"
      - name: 检查投递记录（以远端最新状态为准）
        id: check
        run: |
          git fetch origin main
          if git cat-file -e "origin/main:.sent/details-$ISSUE_DATE" 2>/dev/null; then
            echo "sent=true" >> "$GITHUB_OUTPUT"
            marker="$(git show "origin/main:.sent/details-$ISSUE_DATE" 2>/dev/null || true)"
            if [[ "$marker" == *"smtp_accepted_at="* ]]; then
              echo "已存在结构化 SMTP 接受记录；最终送达仍需收件箱核验"
            else
              echo "::warning::发现旧版空白投递标记。旧版发送步骤曾成功结束，但未保存 SMTP 明细；为避免重复邮件，本次不自动重发。"
            fi
          fi
      - name: 整理晨报
        run: |
          python3 -m py_compile scripts/daily.py
          python3 scripts/daily.py generate
      - name: 安全提交晨读与归档（并发改动自动重试）
        run: |
          git config user.name 'News Digest'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- index.html "archive/$ISSUE_DATE.html" && git ls-files --error-unmatch "archive/$ISSUE_DATE.html" >/dev/null 2>&1; then
            echo "已核实的当期归档与主页无改动，无需重复提交"
            exit 0
          fi
          cp index.html "$RUNNER_TEMP/digest-index.html"
          cp "archive/$ISSUE_DATE.html" "$RUNNER_TEMP/digest-archive.html"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/digest-index.html" index.html
            mkdir -p archive
            cp "$RUNNER_TEMP/digest-archive.html" "archive/$ISSUE_DATE.html"
            git add index.html "archive/$ISSUE_DATE.html"
            if git diff --cached --quiet; then
              echo "晨读内容已在 GitHub，无需重复提交"
              exit 0
            fi
            git commit -m "晨读 $ISSUE_DATE"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "远端有新提交，准备重试第 $attempt 次"
            sleep 4
          done
          echo "::error::晨读连续五次提交冲突"
          exit 1
      - name: 邮件投递
        if: steps.check.outputs.sent != 'true'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          if [ -z "$SMTP_HOST" ] || [ -z "$SMTP_USER" ] || [ -z "$SMTP_PASSWORD" ] || [ -z "$MAIL_TO" ]; then
            echo "::error::SMTP secrets are missing; the daily email cannot be sent"
            exit 1
          fi
          git fetch origin main
          if git cat-file -e "origin/main:.sent/details-$ISSUE_DATE" 2>/dev/null; then
            echo "已存在当期投递记录，跳过重复发送"
            exit 0
          fi
          send_output="$(python3 scripts/daily.py send)"
          printf '%s\n' "$send_output"
          message_id="$(printf '%s\n' "$send_output" | sed -n 's/^Message-ID: //p' | tail -n 1)"
          if [ -z "$message_id" ]; then
            echo "::error::SMTP returned without a traceable Message-ID"
            exit 1
          fi
          mkdir -p .sent
          printf 'smtp_accepted_at=%s\nmessage_id=%s\nfinal_delivery=unverified\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$message_id" > ".sent/details-$ISSUE_DATE"
          git add ".sent/details-$ISSUE_DATE"
          if ! git diff --cached --quiet; then
            git commit -m "记录投递 $ISSUE_DATE"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
