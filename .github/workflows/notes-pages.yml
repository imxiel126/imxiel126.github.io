# Notes are public ONLY after review; publication is handled by social-pages.yml.
name: Publish approved notes to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'notes/**'
      - '.github/workflows/notes-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检查经过审核的公开笔记结构
        run: |
          python3 - <<'PY'
          import json
          data=json.load(open("notes/data.json",encoding="utf-8"))
          assert isinstance(data.get("items"),list), "Expected a public notes array"
          print("Public notes validated; unified publisher will deploy the latest main snapshot.")
          PY
