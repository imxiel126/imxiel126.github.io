<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知行 · 个人认知与成长工作台</title><style>:root{color-scheme:light dark;--accent:#087f70}body{font:16px/1.7 system-ui,sans-serif;margin:0;background:Canvas;color:CanvasText}main{max-width:850px;margin:auto;padding:24px}header{border-bottom:1px solid #8885;padding-bottom:16px}h1{font-size:2.5rem;margin:0;color:var(--accent)}h2{font-size:1.2rem}section{margin:24px 0;padding:20px;border:1px solid #8885;border-radius:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.grid a{padding:16px;border:1px solid #8885;border-radius:10px;color:inherit;text-decoration:none}.grid a:hover{border-color:var(--accent)}label{display:block;padding:8px 0}small{opacity:.75}a{color:inherit}input{accent-color:var(--accent)}</style><main><header><small>每日工作台 · 第一版</small><h1>知行</h1><p>个人认知与成长工作台</p><a href="/">返回原有主页</a></header><section><h2>今日三件事</h2><p id="day"></p><label><input type="checkbox" data-i="0"> 闭卷回忆一个知识点</label><label><input type="checkbox" data-i="1"> 完成一件重要的事</label><label><input type="checkbox" data-i="2"> 记录一个自己的思考</label><p id="progress" aria-live="polite"></p><small>完成状态仅保存在当前浏览器，不上传。</small></section><section><h2>常用入口</h2><div class="grid"><a href="/learn/">今日学习 →</a><a href="/journal/">随手记录 →</a><a href="/brain/">知识检索 →</a><a href="/reading/">阅读与复习 →</a><a href="/">世界观察 →</a><a href="/library/">知识资源 →</a></div></section><section><h2>今日自我检验</h2><p>今天学到的内容，能否不看资料用自己的话解释？</p></section></main><script>const day=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai'}).format(new Date()),key='growth-v1-'+day,boxes=[...document.querySelectorAll('input')];document.getElementById('day').textContent=day;let state=[];try{state=JSON.parse(localStorage.getItem(key)||'[]')}catch{}function render(){document.getElementById('progress').textContent='已完成 '+boxes.filter(b=>b.checked).length+' / '+boxes.length}boxes.forEach((b,i)=>{b.checked=!!state[i];b.addEventListener('change',()=>{try{localStorage.setItem(key,JSON.stringify(boxes.map(b=>b.checked)))}catch{}render()})});render();</script></html>
